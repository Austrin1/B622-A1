<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tezlikle Sizlerle | BY: m.agayev01</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* Arka Plan Glow/Işık Efektleri */
        .bg-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            top: 15%;
            left: 20%;
            filter: blur(50px);
            animation: float 8s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 15%;
            right: 20%;
            filter: blur(60px);
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        /* Glassmorphism Kart */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 60px 50px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Rozet / Badge */
        .badge {
            display: inline-block;
            padding: 8px 18px;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #c084fc;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* Ana Başlık */
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 70%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
        }

        /* Çizgi Detayı */
        .line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        /* İmza / Yazar Kısmı */
        .author {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: #94a3b8;
        }

        .author span {
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hareket Animasyonu */
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 40px); }
        }

        @media (max-width: 600px) {
            .card { padding: 40px 25px; }
            h1 { font-size: 2.2rem; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="card">
        <div class="badge">✦ Yakında ✦</div>
        <h1>TEZLİKLE SİZLERLE</h1>
        <div class="line"></div>
        <p class="author">BY: <span>m.agayev01</span></p>
    </div>

</body>
</html>
