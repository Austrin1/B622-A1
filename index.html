    <!-- JavaScript Logic -->
    <script>
        /* --- Interactive Canvas Ambient Orbs --- */
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: null, y: null, targetX: 0, targetY: 0 };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        class AmbientOrb {
            constructor(color, radius, speedMultiplier) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.baseRadius = radius;
                this.radius = radius;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speedMultiplier;
                this.vy = (Math.random() - 0.5) * speedMultiplier;
                this.pulse = Math.random() * Math.PI;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < -100 || this.x > width + 100) this.vx *= -1;
                if (this.y < -100 || this.y > height + 100) this.vy *= -1;

                if (mouse.x !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 350) {
                        this.x -= (dx / dist) * 0.4;
                        this.y -= (dy / dist) * 0.4;
                    }
                }

                this.pulse += 0.015;
                this.radius = this.baseRadius + Math.sin(this.pulse) * 15;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, this.color[0]);
                gradient.addColorStop(1, this.color[1]);

                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const orbs = [
            new AmbientOrb(['rgba(255, 182, 193, 0.45)', 'rgba(255, 182, 193, 0)'], 220, 0.6),
            new AmbientOrb(['rgba(186, 230, 253, 0.55)', 'rgba(186, 230, 253, 0)'], 260, 0.5),
            new AmbientOrb(['rgba(233, 213, 255, 0.50)', 'rgba(233, 213, 255, 0)'], 200, 0.7),
            new AmbientOrb(['rgba(167, 243, 208, 0.40)', 'rgba(167, 243, 208, 0)'], 240, 0.4)
        ];

        function animateOrbs() {
            if (mouse.x === null) {
                mouse.x = width / 2;
                mouse.y = height / 2;
            } else {
                mouse.x += (mouse.targetX - mouse.x) * 0.05;
                mouse.y += (mouse.targetY - mouse.y) * 0.05;
            }

            ctx.clearRect(0, 0, width, height);

            orbs.forEach(orb => {
                orb.update();
                orb.draw();
            });

            requestAnimationFrame(animateOrbs);
        }
        animateOrbs();

        /* --- Countdown Timer --- */
        const targetDate = new Date().getTime() + (25 * 24 * 60 * 60 * 1000) + (14 * 60 * 60 * 1000);

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        /* --- Copy Founder Handle --- */
        function copyFounderHandle(handle) {
            const textarea = document.createElement('textarea');
            textarea.value = handle;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(`İstifadəçi adı kopyalandı: @${handle}`, 'success');
            } catch (err) {
                showToast(`Founder: @${handle}`, 'info');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        /* --- Theme Switcher --- */
        function setThemePreset(preset) {
            const title = document.getElementById('main-title');
            title.className = 'text-5xl sm:text-7xl md:text-8xl font-black tracking-tight mb-10 leading-none drop-shadow-sm py-2 ';

            if (preset === 'neon') {
                title.className += 'gradient-text-neon';
                showToast('Neon palitrası seçildi', 'info');
            } else if (preset === 'aurora') {
                title.className += 'gradient-text-aurora';
                showToast('Aurora palitrası seçildi', 'info');
            } else if (preset === 'sunset') {
                title.className += 'bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-600 bg-clip-text text-transparent';
                showToast('Qürub palitrası seçildi', 'info');
            }
        }

        /* --- Toast Notification System --- */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' 
                ? 'bg-slate-900 text-white' 
                : 'bg-white/90 backdrop-blur-md text-slate-800 border border-slate-200';
            
            toast.className = `toast-enter px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-medium flex items-center gap-2.5 ${bgClass} pointer-events-auto`;
            
            const icon = type === 'success'
                ? `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`
                : `<svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }
    </script>
